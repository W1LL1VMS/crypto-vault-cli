[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-vault-cli"
version = "0.1.0"
description = "Outil CLI de chiffrement hybride AES-256 + RSA-2048"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "rich",
]

[project.scripts]
crypto-vault = "crypto_vault.main:main"

[tool.setuptools.packages.find]
where = ["src"]